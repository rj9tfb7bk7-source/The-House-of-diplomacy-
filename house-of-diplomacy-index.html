<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071a3a">
<title>House of Diplomacy — Beyond MUNs. Beyond Borders.</title>
<meta name="description" content="House of Diplomacy — a youth-led house for politics, diplomacy, culture and debate.">
<style>
:root{--ink:#071a3a;--paper:#f4eddb;--gold:#b89b5b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
body{overflow-x:hidden}
.hero{position:relative;min-height:100svh;display:flex;align-items:center;isolation:isolate;overflow:hidden;background:#e9e0cb}
.art{position:absolute;inset:0;z-index:-2;overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;animation:drift 34s ease-in-out infinite alternate;will-change:transform}
.art:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(242,235,218,.48) 0%,rgba(242,235,218,.20) 32%,transparent 64%);pointer-events:none}
.content{width:min(1240px,100%);margin:auto;padding:clamp(28px,6vw,90px);}
.brand{display:inline-flex;align-items:center;gap:12px;text-transform:uppercase;letter-spacing:.19em;font:600 11px/1.4 Arial,sans-serif;margin-bottom:clamp(70px,14vh,150px)}
.brand-mark{width:32px;height:32px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:17px}
h1{font-size:clamp(48px,7.3vw,104px);line-height:.98;letter-spacing:-.055em;font-weight:400;max-width:720px;margin:0 0 28px}
h1 em{font-weight:400;color:#173b61}
.lede{font:400 clamp(14px,1.4vw,18px)/1.8 Arial,sans-serif;max-width:470px;color:#263d51;margin:0 0 30px}
.actions{display:flex;flex-wrap:wrap;gap:12px}
a.button{display:inline-block;text-decoration:none;padding:14px 21px;border:1px solid var(--ink);font:600 11px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);transition:background .25s,color .25s,transform .25s}
a.button.primary{background:var(--ink);color:#fff}
a.button:hover{transform:translateY(-2px);background:var(--gold);border-color:var(--gold);color:#fff}
.corner{position:absolute;right:30px;bottom:25px;font:10px Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#173b61}
@keyframes drift{from{transform:scale(1.04) translateX(1.2%)}to{transform:scale(1.1) translateX(-1.2%)}}
@media(max-width:700px){.art img{object-position:58% center;animation-duration:42s}.art:after{background:linear-gradient(90deg,rgba(242,235,218,.82),rgba(242,235,218,.55) 54%,rgba(242,235,218,.12))}.content{padding:28px 24px}.brand{margin-bottom:18vh}h1{font-size:clamp(46px,12vw,76px)}.corner{right:18px;bottom:16px;font-size:8px}}
@media(prefers-reduced-motion:reduce){.art img{animation:none}*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
